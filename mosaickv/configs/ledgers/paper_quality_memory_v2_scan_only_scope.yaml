scan_scope:
  operation: cpu_identity_and_provenance_only_exclusion_scan
  purpose: determine_whether_any_realworldqa_sample_identity_was_previously_used
  dataset_id: lmms-lab/RealWorldQA
  dataset_config: default
  dataset_revision: 907c4e5228fd1703c710ed937601cb5f89ab8d5c
  split: test
  canonical_identity_fields:
    - dataset_id
    - dataset_config
    - dataset_revision
    - split
    - sample_id
  allowed_read_roots:
    - /scratch/djy8hg/workdir/MosaicKV/mosaickv/configs/ledgers
    - /scratch/djy8hg/runs/mosaickv
  allowed_artifact_kinds:
    - json
    - jsonl
    - yaml
    - yml
    - parquet_schema_and_identity_columns_only
  allowed_record_fields:
    - schema_version
    - task
    - task_name
    - dataset_id
    - dataset_config
    - dataset_revision
    - split
    - sample_id
    - canonical_sample_identity
    - run_id
    - source_path
    - source_sha256
    - source_record_count
    - identity_count
    - worktree_dirty
    - git_sha
    - config_sha
  forbidden_record_fields:
    - answer
    - answers
    - reference
    - references
    - task_score
    - generated_tokens
    - token_agreement
    - logits
    - logit_kl
    - attention
    - media
    - image
    - prompt
    - error
    - failure_identity
  required_behavior:
    - recursively_enumerate_both_allowed_read_roots
    - inspect_only_identity_and_provenance_fields
    - bind_every_scanned_source_path_to_sha256_and_record_count
    - normalize_only_explicitly_complete_canonical_identities
    - deduplicate_by_complete_canonical_identity
    - treat_dataset_level_mentions_without_sample_ids_as_nonidentity_metadata
    - fail_closed_on_realworldqa_sample_records_with_incomplete_or_ambiguous_provenance
    - never_load_dataset_rows_media_prompts_answers_references_scores_or_failures
    - never_rank_or_select_candidate_samples
    - never_modify_source_artifacts
  only_permitted_output: /scratch/djy8hg/runs/mosaickv/paper-quality-memory-v2-frozen-99a412b/inputs/exclusion_manifest_realworldqa.json
  output_must_not_exist_before_scan: true
  output_must_be_created_atomically: true
  output_must_be_write_once_and_read_only: true
  output_must_record_source_paths_hashes_record_counts_and_canonical_identities: true
  manifest_hash_and_content_review_required_before_any_next_action: true

execution_environment:
  execution_mode: local_cpu_only
  common_environment: /scratch/djy8hg/env/mosaickv
  cache_policy_must_be_sourced: true
  cache_root: /scratch/djy8hg/cache/mosaickv
  network_access_allowed: false
  dataset_download_allowed: false
  home_cache_allowed: false
  model_loading_allowed: false
  gpu_access_allowed: false
