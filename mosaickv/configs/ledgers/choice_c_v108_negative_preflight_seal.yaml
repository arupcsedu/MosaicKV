root_cause:
  classification: single_position_feasible_joint_candidate_and_incomplete_fallback_accounting
  details: >-
    Filtering each FullKV-to-54-position ladder rebased its sole representable
    target as level zero. That left zero positive-savings screening partitions,
    so each attempted sample evaluated only joint-0 and used one of 24 allowed
    probes before failing closed to FullKV. The runtime computed exact storage
    accounting internally, but the hard-budget fallback serializer omitted all
    six fields and did not retain the rejected compressed proposal separately.
