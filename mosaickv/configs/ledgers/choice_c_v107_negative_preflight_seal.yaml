root_cause:
  classification: feasible_and_unrestricted_level_namespace_collision
  details: >-
    Position-feasible ladders reindexed their largest feasible level to zero,
    while the unrestricted FullKV fallback also used level zero. The runtime
    artifact cache keyed only on route/level indices and could therefore
    retrieve a feasible compressed construction for a FullKV fallback
    decision. The resulting logical byte mismatch was correctly fatal, but
    the old exception did not emit the required structured accounting trace.
