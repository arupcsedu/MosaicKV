design:
  name: output_impact_first_cross_head_capped_cumulative_reservation
  candidate_scope: scalar_prompt_topk_exact_optional_blocks
  protected_core_stage: before_query_coverage_allocation
  pooled_value_definition: fp32_mean_value_vector_over_each_source_block
  nearest_value_deviation_formula: >-
    min_{j in same_route_scalar_core, j != i}
    ||v_i-v_j||_2 / (||v_i||_2+||v_j||_2+epsilon)
  singleton_value_deviation: 1.0
  output_impact_score_formula: >-
    prompt_attention_i / total_optional_route_prompt_attention
    * nearest_value_deviation_i
  output_impact_tie_breaking: descending_score_then_descending_prompt_share_then_node_id
  complete_reservation_fraction: 0.25
  output_impact_share_of_reservation: 0.5
  effective_output_impact_fraction_of_optional_capacity: 0.125
  remaining_reservation_use: capped_cumulative_prompt_query_coverage
  coverage_objective: sum_q_min_tau_q_sum_selected_i_attention_q_i
  coverage_formula: "sum_q min(tau_q, sum_{i in S} a_qi)"
  cap_definition: tau_q_equals_0.5_times_complete_route_query_mass_q
  cumulative_cap_fraction: 0.5
  head_allocation_risk: normalized_uncovered_capped_cumulative_mass_under_scalar_prompt_topk
  allocation_priority: head_risk_divided_by_one_plus_already_reserved_fraction
  within_head_query_priority: normalized_marginal_capped_query_mass_plus_weighted_prompt_mass
  prompt_mass_weight: 0.5
  minimum_prompt_mass_fraction_vs_same_capacity_scalar_anchor: 0.95
  exact_capacity_rule: >-
    protect_only_scalar_core_blocks_then_add_query_blocks_only_if_remaining
    block_sizes_can_fill_the_target_exactly
  active_byte_change_vs_same_capacity_anchor: 0
  dense_layout_interpretation: >-
    Output-impact protection changes which scalar exact blocks can be
    displaced inside an existing head capacity. It does not create ragged
    physical tensors or change the shared backend position limit.
  reason: >-
    V92 passed both task memory gates but its post-selection output-impact
    gate rejected every query-coverage change and still failed fidelity.
    V93 therefore moves the same label-blind signal before query allocation:
    high-impact scalar exact blocks are protected first, and query diversity
    competes only for the remaining reservation.
  ocr_metadata_claimed: false
  note: >-
    V92 answers, references, scores, generated tokens, per-sample telemetry,
    and failure identities were not inspected for this design. Only sealed
    aggregate gate outcomes and aggregate mechanism activity informed V93.

