      dataset_revision: 539088ef8a8ada01ac8e2e6d4e372586748a265e
      split: validation
      id_only_catalog: /scratch/djy8hg/runs/mosaickv/choice-c-v102-v100-fresh-cross-dataset-calibration-v1/inputs/catalog_infovqa_validation_id_projected_v2.json
      id_only_catalog_sha256: 38907d03d42a6c52d898b3a543ad2cd737b85569c465ad301ca148aa72e4308c
      planned_ledger: /scratch/djy8hg/runs/mosaickv/choice-c-v104-joint-reallocation-preflight-v1/inputs/preflight_infovqa.json

preflight_gate:
  submission_authorized_after_clean_immutable_commit: true
  arms_on_identical_samples:
    - full_kv
    - prompt_attention_topk
    - v104_hierarchical_fixed_capacity_joint_reallocation
  warmups_per_arm: 1
  measured_repetitions_per_arm: 1
  output_length: 64
  seed: 17
  every_candidate_sample_must_complete: true
  every_candidate_sample_must_reach_compressed_target: true
  fullkv_fallback_passes: false
  maximum_candidate_evaluations: 24
  maximum_sequential_rounds: 6
  require_correct_textvqa_annotation_list: true
  require_zero_residual_bytes: true
  require_no_over_budget_pack_or_decode: true
  every_trace_must_record:
    - status
    - effective_method
    - used_fullkv_fallback
    - attempted_active_kv_bytes
    - hard_active_kv_budget_bytes
    - probe_decisions
    - timing_breakdown
    - byte_budget_materialization
    - hierarchical_logit_safe_eviction
  positive_result_may_authorize_calibration_automatically: false
  separate_positive_review_required: true

downstream_actions:
  calibration_ledger_materialization_authorized: false
  calibration_execution_authorized: false
  candidate_freeze_authorized: false
  heldout_materialization_authorized: false
  heldout_execution_authorized: false
