  implementation_git_sha_recorded_in_materialized_worker_spec: true
  source_worktree_must_be_clean: true
  runtime_behavior_changes_after_implementation_commit_allowed: false
  common_environment: /scratch/djy8hg/env/mosaickv
  model_cache_root: /scratch/djy8hg/cache/mosaickv

candidate:
  model: llava-hf/llava-1.5-7b-hf
  backend: hf
  attention_implementation: eager
  decode_attention_implementation: sdpa
  method: mosaickv_exact
  effective_variant: v104_hierarchical_fixed_capacity_joint_reallocation
  active_budget_bytes: 28500000
  block_size_tokens: 4
  maximum_prototypes_per_head: 0
  residual_storage_enabled: false
  repair_enabled: false
  forecast_mode: prompt_window
  forecast_prompt_window: 16
  forecast_draft_steps: 0
  hierarchical_partition_count: 8
  hierarchical_maximum_refinement_depth: 2
  hierarchical_maximum_candidate_evaluations: 24
  hierarchical_maximum_sequential_rounds: 6
  hierarchical_maximum_rollback_rounds: 2
  hierarchical_horizon: 2
  hierarchical_maximum_forward_kl: 0.02
  hierarchical_maximum_absolute_logit_difference: 1.0
  hierarchical_greedy_token_match_required: true

joint_reallocation:
  trigger: initial_final_joint_probe_failed
  source_of_candidates: label_blind_same_byte_route_boundary_swaps
  affected_route_order: descending_evicted_output_impact_then_route_id
  ordinary_round_width: 1
  second_round_width_if_budget_remains: 2
  maximum_alternatives_per_route: 2
  every_route_active_bytes_must_equal_initial_target_route_bytes: true
  every_route_physical_positions_must_remain_at_or_below_dense_cap: true
  global_active_bytes_must_not_change: true
  atomic_and_mandatory_blocks_must_remain_selected: true
  every_candidate_requires_isolated_joint_probe: true
  unprobed_candidate_may_not_be_selected: true
  failed_candidates_are_discarded: true
  fullkv_fallback_remains_fail_closed: true

fresh_identity_plan:
  selection_salt: choice-c-v104-joint-reallocation-preflight-v1
  selection_seed: 104017
  selection_rule: sha256_digest_ascending_then_canonical_sample_id
  selection_preimage_separator: _null_
  labels_references_scores_media_prompts_or_failure_outcomes_inspected_for_selection: false
  predecessor_exclusion_manifest: /scratch/djy8hg/runs/mosaickv/choice-c-v103-fresh-identity-calibration-v1/inputs/exclusion_manifest.json
  additionally_excluded_v103_preflight_ledgers:
    - /scratch/djy8hg/runs/mosaickv/choice-c-v103-fresh-identity-calibration-v1/inputs/preflight_textvqa_train.json
    - /scratch/djy8hg/runs/mosaickv/choice-c-v103-fresh-identity-calibration-v1/inputs/preflight_infovqa.json
  sample_count_per_task: 2
  ledgers_materialized: false
  ledger_materialization_authorized: true
  gpu_preflight_authorized: true
  tasks:
    - task: textvqa_train_calibration
      dataset_id: lmms-lab/textvqa
      dataset_config: default
      dataset_revision: 9c0699cd19768ac5ab97568f6b3cbac4c0062884
      split: train
      id_only_catalog: /scratch/djy8hg/runs/mosaickv/choice-c-v102-v100-fresh-cross-dataset-calibration-v1/inputs/catalog_textvqa_train_id_projected_v2.json
      id_only_catalog_sha256: 5a6f700a623da65ae62bf4abc7317dcea48f0a9388f4047d3de8cfd643aece8d
      planned_ledger: /scratch/djy8hg/runs/mosaickv/choice-c-v104-joint-reallocation-preflight-v1/inputs/preflight_textvqa_train.json
    - task: infovqa
      dataset_id: lmms-lab-encoder/DocVQA
