schema_version: 1
experiment_id: hyperparameter_generalization_small_v1
classification: exploratory_dirty_tree_hyperparameter_generalization_v1
time_budget_hours: 3.5
seed: 17
output_length: 8
primary_budget: packed_prefill_active_kv_bytes

calibration:
  model: qwen2_5_vl_3b
  task: docvqa
  ledger: configs/ledgers/generalization_calibration_docvqa.json
  winner_rule:
    - maximize_mean_task_score
    - maximize_mean_token_agreement
    - maximize_mean_selected_block_recall
    - minimize_mean_forecast_regret
    - minimize_mean_end_to_end_seconds
    - lexicographic_candidate_id
  candidates:
    - id: hybrid1
      forecast_mode: hybrid
      draft_steps: 1
    - id: hybrid4
      forecast_mode: hybrid
      draft_steps: 4
    - id: prompt_only
      forecast_mode: prompt_window
      draft_steps: 0

fixed_hyperparameters:
  retention_ratio: 0.2
  block_size: 16
  prompt_window: 16
  centroid_count: 4
  graph_max_neighbors: 24
  minimum_stratum_fraction: 0.0
  prototype_group_size: 12
  prototype_max_position_span: 256
  repair_policy: prototype_risk
  repair_entropy_threshold: 0.01
  repair_prototype_risk_threshold: 1.0e-6
  repair_prototype_risk_min_entropy: 0.005
  repair_max_blocks_per_step: 1
  repair_candidate_ranking: risk_weighted_reconstruction_error
  preserve_partial_prototype: true

evaluation:
  models:
    - qwen2_5_vl_3b
    - qwen2_5_vl_7b
    - llava_1_5_7b
  tasks:
    mmstar: configs/ledgers/generalization_evaluation_mmstar.json
    docvqa: configs/ledgers/generalization_evaluation_docvqa.json
    chartqa: configs/ledgers/generalization_evaluation_chartqa.json
  uniform_algorithmic_method: mosaickv_exact
  architecture_adaptations:
    qwen2_5_vl_3b: mosaickv_full
    qwen2_5_vl_7b: mosaickv_full
    llava_1_5_7b: unsupported_prototype_repair_post_rope

backend_parity:
  model: qwen2_5_vl_3b
  task: mmstar
  sample_ids: ["mmstar:1343"]
  cells:
    - {id: full_eager, method: full_kv, prefill: eager, decode: eager}
    - {id: full_sdpa, method: full_kv, prefill: sdpa, decode: sdpa}
    - {id: full_fa2, method: full_kv, prefill: flash_attention_2, decode: flash_attention_2}
    - {id: exact_eager, method: mosaickv_exact, prefill: eager, decode: eager}
    - {id: exact_sdpa_decode, method: mosaickv_exact, prefill: eager, decode: sdpa}
    - {id: exact_fa2_decode, method: mosaickv_exact, prefill: eager, decode: flash_attention_2}

unsupported:
  - combination: llava_onevision_7b_optional/*
    reason: The pinned 7B checkpoint is not cached and has no exact registered runtime gate.
  - combination: vllm/mosaickv_*
    reason: >-
      This historical campaign has no hash-bound common-selector catalog input.
      The separate pinned vLLM 0.10.2 exact-selection launcher is supported;
      prototype and repair rows remain unsupported.
  - combination: sglang/mosaickv_*
    reason: SGLang 0.5.1 exposes no atomic request mapping, allocator, Radix, and position transaction.
  - combination: hf_sdpa/mosaickv_proto_or_full
    reason: Prototype risk and residual repair require eager attention capture.
  - combination: hf_flash_attention_2/mosaickv_proto_or_full
    reason: Prototype risk and residual repair require eager attention capture.
  - combination: llava_1_5_7b/mosaickv_proto_or_full
    reason: Cached keys are post-RoPE and no audited LLaVA inverse/anchor transform exists.
