    partition_key: deterministic_layer_head_risk_and_proposed_removed_bytes
    byte_balanced_partitions: true
    initial_partition_count: 8
    maximum_binary_refinement_depth: 2
    safe_partition_behavior: retain_its_largest_verified_capacity_drop
    unsafe_partition_behavior: split_once_per_level_then_keep_unresolved_routes_exact
  global_assembly:
    item: one_verified_nested_capacity_step_for_one_route_or_route_partition
    objective: reach_cap_with_minimum_excess_savings_then_maximize_label_blind_evidence_utility
    solver: deterministic_multiple_choice_knapsack
    one_capacity_level_per_route: true
    atomic_layout_groups_never_partially_removed: true
    selected_active_bytes_must_not_exceed_cap: true
  joint_verification:
    required: true
    reference: one_reused_fullkv_teacher_forced_greedy_prefix
    failed_joint_candidate_behavior: conflict_directed_partition_rollback_and_safe_donor_exchange
    maximum_rollback_rounds: 2
    final_cache_must_pass_joint_gate: true
  fail_closed_behavior:
    execute_best_jointly_verified_exact_cache: true
    record_actual_active_bytes: true
    mark_target_reached_false_when_cap_is_not_met: true
    unverified_target_cache_fallback_forbidden: true
    failed_sample_record_required: true

