design:
  name: coherent_layout_group_cross_head_capped_cumulative_reservation
  candidate_scope: optional_visual_blocks_with_authoritative_normalized_regions
  protected_group_stage: before_query_coverage_allocation
  structural_source_identity: layer_head_modality_image_page_frame_and_coarse_row
  reading_order: ascending_original_logical_position_then_node_id
  group_definition: contiguous_nonoverlapping_reading_order_chunks
  maximum_blocks_per_group: 4
  minimum_blocks_per_group: 2
  coarse_row_bins: 4
  group_score_formula: >-
    normalized_capped_prompt_query_mass_covered_by_group
    + 0.5 * normalized_scalar_prompt_attention_mass_of_group
  group_priority: descending_score_per_position_then_score_then_prompt_share_then_identity
  complete_reservation_fraction: 0.25
  coherent_group_share_of_reservation: 0.5
  effective_group_fraction_of_optional_capacity: 0.125
  remaining_reservation_use: capped_cumulative_prompt_query_coverage
  coverage_objective: "sum_q min(tau_q, sum_{i in S} a_qi)"
  cap_definition: tau_q_equals_0.5_times_complete_route_query_mass_q
  minimum_prompt_mass_fraction_vs_same_capacity_scalar_anchor: 0.95
  exact_capacity_rule: >-
    protect_a_complete_group_only_when_remaining_block_sizes_can_still_fill
    the_route_target_exactly
  missing_metadata_behavior: fail_closed_without_group_protection
  ocr_metadata_claimed: false
  layout_metadata_claimed: normalized_processor_grid_regions_only
  active_byte_change_vs_same_capacity_anchor: 0
  reason: >-
    V93 passed memory but isolated high-impact blocks did not preserve stable
    decoding. V94 reserves complete spatial reading-order groups so related
    document or chart patches survive together, while explicitly refusing to
    describe processor-grid regions as OCR boxes.
  note: >-
    V93 answers, references, scores, generated tokens, per-sample telemetry,
    and failure identities were not inspected. Only sealed aggregate gate
    outcomes and aggregate mechanism activity informed V94.

