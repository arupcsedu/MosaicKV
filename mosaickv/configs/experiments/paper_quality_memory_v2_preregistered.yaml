deterministic_selection:
  select_before_loading_media_prompts_answers_references_or_labels: true
  canonical_identity_fields:
    - dataset_id
    - dataset_config
    - dataset_revision
    - split
    - sample_id
  ordering: sha256_digest_ascending_then_canonical_identity
  hash_preimage_fields:
    - experiment_id
    - task
    - dataset_id
    - dataset_config
    - dataset_revision
    - split
    - selection_seed
    - canonical_sample_identity
  exclude_prior_identities_before_ranking: true
  choose_first_n_remaining: true
  replacement_after_outcome_inspection: prohibited
  insufficient_eligible_pool: fail_closed
  write_once_read_only_ledgers_required: true
  identity_manifest_hash_review_required_before_materialization: true
  disjointness_report_hash_review_required_before_gpu_execution: true

methods:
  - full_kv
  - prompt_attention_topk
  - mosaickv_full__paper_candidate_v1
nearest_baseline: prompt_attention_topk

controlled_runtime:
  model_id: llava-hf/llava-1.5-7b-hf
  model_revision: b234b804b114d9e37bb655e11cbbb5f5e971b7a9
  precision: fp16
  backend: huggingface
  prefill_attention_implementation: eager
  decode_attention_implementation: eager
  processor_and_chat_template_identical_across_arms: true
  media_and_media_preprocessing_identical_across_arms: true
  prompt_text_and_tokenization_identical_across_arms: true
  generation_seed: 17
  deterministic_generation: true
  do_sample: false
  temperature: 0.0
  top_p: 1.0
  max_new_tokens: 64
  output_length_policy: fixed_max_new_tokens
  same_output_length_across_arms: true
  same_mandatory_token_policy_across_compressed_arms: true
  same_block_granularity_across_compressed_arms: true
  sample_execution_order: full_kv_then_prompt_attention_topk_then_frozen_candidate

memory_gate:
  comparator: prompt_attention_topk
  accounting_boundary: measured_attention_active_key_and_value_tensor_storage_bytes
  target_candidate_active_fraction_of_paired_baseline: 0.699
  minimum_active_memory_reduction_fraction: 0.30
  strict_inequality_required: true
  require_every_paired_sample_to_pass: true
  require_every_task_to_pass: true
  residual_bytes_are_not_active_bytes: true
  residual_bytes_must_be_reported_separately: true
  total_cache_bytes_must_be_reported_as_secondary_metric: true
  nominal_retention_ratio_is_not_the_primary_budget: true

quality_gate:
  comparator: prompt_attention_topk
  paired_score_margin: 0.0
  require_candidate_mean_official_score_at_least_baseline: true
  require_every_task_to_pass_separately: true
  incompatible_metrics_must_not_be_macro_averaged: true
  paired_bootstrap_repetitions: 10000
  paired_bootstrap_confidence_level: 0.95
  bootstrap_seed: 20270831
  confidence_interval_is_reported_not_used_to_weaken_the_zero_margin_gate: true
  exact_answer_agreement_is_secondary_diagnostic: true
  token_agreement_is_secondary_diagnostic: true

completeness_gate:
  require_all_1152_method_example_rows: true
  failed_samples_must_have_error_rows: true
  missing_samples_or_metrics_fail_the_protocol: true
  nan_metrics_fail_the_protocol: true
  fullkv_fallback_in_candidate_row_fails_the_protocol: true
  retention_one_reference_parity_required_before_compressed_execution: true
  exact_provenance_manifest_required_for_every_row: true

statistical_design:
  fixed_sample_size_selected_before_outcome_inspection: true
  sample_count_per_task: 128
  increase_over_two_sample_development_gate: 64
  paired_analysis_unit: canonical_sample_identity
  primary_results_are_per_task: true
  stopping_or_sample_replacement_after_result_inspection: prohibited
  no_formal_power_claim_without_preexisting_paired_variance_estimate: true
  report_effect_sizes_and_paired_bootstrap_intervals: true

planned_outputs:
