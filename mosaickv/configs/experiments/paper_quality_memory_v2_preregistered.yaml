  installed_lmms_task: realworldqa
  installed_task_scoring: exact_match_mean
  external_judge_required: false
  preliminary_repository_and_run_name_audit_hits: 0
  preliminary_audit_is_not_a_substitute_for_identity_exclusion_scan: true
  untouched_status_before_formal_scan: provisionally_untouched_fail_closed
  dataset_homepage: https://huggingface.co/datasets/lmms-lab/RealWorldQA

