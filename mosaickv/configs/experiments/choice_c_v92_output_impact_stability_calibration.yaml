design:
  name: output_impact_risk_weighted_cross_head_capped_cumulative_reservation
  coverage_objective: sum_q_min_tau_q_sum_selected_i_attention_q_i
  coverage_formula: "sum_q min(tau_q, sum_{i in S} a_qi)"
  cap_definition: tau_q_equals_0.5_times_complete_route_query_mass_q
  cumulative_cap_fraction: 0.5
  head_allocation_risk: normalized_uncovered_capped_cumulative_mass_under_scalar_prompt_topk
  allocation_scope: query_conditioned_exact_reservation_bytes_across_stable_heads
  global_reservation_fraction: 0.25
  allocation_priority: head_risk_divided_by_one_plus_already_reserved_fraction
  within_head_priority: normalized_marginal_capped_query_mass_plus_weighted_prompt_mass
  prompt_mass_weight: 0.5
  minimum_prompt_mass_fraction_vs_same_capacity_scalar_anchor: 0.95
  stability_risk_mode: output_impact
  donor_set: scalar_prompt_topk_blocks_removed_by_the_proposal
  recipient_set: proposal_blocks_absent_from_scalar_prompt_topk
  pooled_value_definition: fp32_mean_value_vector_over_each_source_block
  donor_value_deviation_formula: >-
    min_{a in recipients} ||v_d-v_a||_2 / (||v_d||_2+||v_a||_2+epsilon)
  output_impact_risk_formula: >-
    sum_{d in donors} (prompt_attention_d / total_optional_route_prompt_attention)
    * donor_value_deviation_d
  empty_recipient_action: fail_closed_with_unit_risk
  zero_prompt_mass_action: zero_attention_weighted_output_impact_risk
  stability_acceptance_formula: >-
    proposed_normalized_coverage_gain >= 0.005 and
    proposed_normalized_coverage_gain >= 4.0 * proposed_output_impact_risk
  minimum_normalized_coverage_gain: 0.005
  minimum_gain_to_output_impact_risk_ratio: 4.0
  stability_failure_action: restore_complete_route_scalar_prompt_topk_selection
  exact_capacity_rule: reserve_only_if_remaining_block_sizes_can_fill_target_exactly
  active_byte_change_vs_same_capacity_anchor: 0
  dense_layout_interpretation: >-
    The stability gate changes which blocks occupy a head's existing dense
    capacity. It does not create ragged physical tensors or change the shared
    backend position limit.
  reason: >-
    V91 rejected most proposals but did not stabilize token-level behavior.
    Prompt mass alone ignores whether a displaced value vector can change the
    attention output. V92 keeps the allocation, byte cap, and numeric gates
    fixed while replacing only the donor-risk signal with a label-blind
    attention-times-value-deviation proxy.
  ocr_metadata_claimed: false
  note: >-
    V91 answers, references, scores, generated tokens, per-sample telemetry,
    and failure identities were not inspected for this design. Only sealed
    aggregate gate outcomes and aggregate mechanism activity informed V92.

