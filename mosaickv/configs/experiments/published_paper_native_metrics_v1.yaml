        repository_commit: null
      - name: streamingllm_reimpl
        source: mosaickv.baselines.published_kv; audited against third_party/StreamingLLM
        status: local_reimplementation
        repository_commit: 2e5042606d69933d88fbf909bd77907456b9b4dd
      - name: h2o_reimpl
