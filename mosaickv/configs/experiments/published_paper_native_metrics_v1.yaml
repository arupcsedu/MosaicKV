schema_version: 1
suite_id: published_paper_native_metrics_v1

# This file defines authorized metric- and dataset-faithful reproduction
# tracks. Every run must still record immutable dataset, sample, and
# environment revisions in its manifest. Methods with execution_enabled=false
# are provenance records only and must not produce rows.
protocols:
  - protocol_id: prefixkv_hf_reimpl_native_metrics_v1
    result_category: paper_reproduction
    paper: "PrefixKV: Adaptive Prefix KV Cache is What Vision Instruction-Following Models Need for Efficient Generation"
    primary_source: https://arxiv.org/abs/2412.03409
    model: llava-hf/llava-1.5-7b-hf
    model_revision: b234b804b114d9e37bb655e11cbbb5f5e971b7a9
    retention_ratios: [1.0, 0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3, 0.2, 0.1]
    execution_authorized: true
    budget_convention:
      name: prefixkv_layerwise_retained_prefix_ratio
      nominal_unit: retention_ratio
      denominator: complete prefill K/V positions in every decoder layer and KV head
      mandatory_token_policy: paper prefix plus protected special tokens
      runtime_mandatory_policy: method
      active_byte_accounting_sha256: 60915ac01ad35843c4de56620864145d5b81b973a3bfec03fb322d5e4f6ff695
      block_size: 1
      require_measured_active_bytes: true
    supported_environment:
      name: mosaickv-common-hf-eager-v1
      backend: huggingface
      attention_implementation: eager
      precision: bf16
      processor_id: llava-hf/llava-1.5-7b-hf
      processor_revision: b234b804b114d9e37bb655e11cbbb5f5e971b7a9
      environment_lock_sha256: a7a7979a3cf50256730ac9353d92428828fb0ec4a7ae8b8bec3ac83624d2a85e
    tasks:
      - name: llava_description
        dataset: PrefixKV/LLaVA-Description
        split: official_1000
        sample_count: 1000
        metrics: [teacher_forced_ppl, rouge_l_f1]
        aggregation: token-weighted corpus PPL and mean per-sample ROUGE-L F1
      - name: mmvet_prefixkv
        dataset: PrefixKV/MM-Vet
        split: official_218
        sample_count: 218
        metrics: [teacher_forced_ppl, rouge_l_f1]
        aggregation: token-weighted corpus PPL and mean per-sample ROUGE-L F1
    methods:
      - name: prefixkv_official
        source: third_party/PrefixKV
        status: official_pinned
        repository_commit: 597f1ab032704951550f93bcc8a23f1454b80aa4
        execution_enabled: false
      - name: prefixkv_reimpl
        source: mosaickv.baselines.prefixkv
        status: local_reimplementation
        repository_commit: 597f1ab032704951550f93bcc8a23f1454b80aa4
      - name: full_kv
        source: mosaickv FullKV reference
        status: local_reference
        repository_commit: null
      - name: mosaickv_exact
        source: mosaickv exact-selection tier
        status: local_reference
        repository_commit: null
      - name: elastic_cache_reimpl
        source: mosaickv.baselines.published_kv; audited against third_party/ElasticCache
        status: local_reimplementation
        repository_commit: 3138e03fc8894231d98a2e5353f27a59af854cc3
      - name: pyramidkv_reimpl
        source: mosaickv.baselines.published_kv; audited against third_party/PyramidKV
        status: local_reimplementation
        repository_commit: 1ca16d6ea0bc3e48fc4cc8623bc4901bc131d511
      - name: h2o_reimpl
        source: mosaickv.baselines.published_kv; paper-derived H2O policy
        status: local_reimplementation
        repository_commit: null

