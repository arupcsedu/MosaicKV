design:
  name: feasible_initial_prompt_query_coverage_reservation
  coverage_objective: sum_over_prompt_queries_of_max_selected_block_attention_mass
  reservation_scope: stable_head_optional_exact_positions
  reservation_fraction: 0.25
  reservation_priority: normalized_marginal_query_coverage_plus_weighted_prompt_mass
  prompt_mass_weight: 0.5
  minimum_prompt_mass_fraction_vs_same_capacity_scalar_anchor: 0.95
  exact_capacity_rule: reserve_only_if_remaining_block_sizes_can_fill_target_exactly
  fallback_rule: use_scalar_prompt_topk_when_coverage_does_not_increase_or_prompt_floor_fails
  active_byte_change_vs_same_capacity_anchor: 0
  ocr_metadata_claimed: false
  note: >-
    The V87 answer outputs and failure identities were not inspected for this
    design. V88 responds only to the aggregate label-blind observation that
    V87 accepted very few post-selection swaps. It reserves query-diverse
    evidence during the initial feasible byte allocation instead.

common_cache_policy:
  block_size: 4
  physical_budget_block_size: 4
  physical_budget_mandatory_policy: last_token

