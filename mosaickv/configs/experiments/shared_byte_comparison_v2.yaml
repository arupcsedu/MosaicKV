  choose_largest_feasible_allocation_below_cap: true
  cross_method_realized_byte_tolerance: 0
  target_shortfall: record_bytes_and_independent_layout_feasibility_certificate
  unequal_feasible_allocations: unsupported_at_this_cap_not_same_budget
  required_storage_measurements: [initial, final, peak]
  additional_measurements: [physical_slot_payload, prefill_source_bytes, peak_gpu_allocated, peak_gpu_reserved]
  decode_growth: append_only_no_eviction
  peak_boundary: live_decode_cache_including_preallocation_and_padding_not_process_peak
  precision: fp16
  backend: huggingface
  attention: eager
  block_size: 1
  physical_budget_block_size: 1
  output_policy: fixed_max_new_tokens
  generation: {do_sample: false, temperature: 0.0, top_p: 1.0}
  quality_repetitions: 1
  warmups_per_method: 5
  dedicated_latency_repetitions: 20
  seed: 20271014
  fullkv_role: quality_reference_only
  baseline_origin: reimpl
  paper_reproduction: separate_environment_budget_and_table_not_a_unified_row

