schema_version: 1
experiment_id: residual_repair_detailed_small_v1
classification: exploratory_dirty_tree_repair_sweep_v1
model: qwen2_5_vl_3b
backend: hf_eager_prefill_eager_decode
retention_ratio: 0.2
block_size: 16
prototype_group_size: 12
prototype_max_position_span: 256
minimum_stratum_fraction: 0.1
graph_max_neighbors: 24
output_length: 8
seed: 17
subset_size_by_task:
  mmstar: 2
  docvqa: 2
  chartqa: 2
  videomme: 1
tasks: [mmstar, docvqa, chartqa, videomme]
primary_budget: packed_prefill_active_kv_bytes
base_repair:
  entropy_threshold: 0.01
  prototype_risk_threshold: 1.0e-6
  max_blocks_per_step: 2
  storage_dtype: lossless
  placement: cpu_pinned
variants:
  - {id: F, name: full_kv_reference, kind: full_kv}
  - {id: N, name: no_repair, policy: none}
  - {id: E, name: entropy_only, policy: entropy}
  - {id: P, name: prototype_risk_only, policy: prototype_risk}
  - {id: C, name: combined_risk, policy: entropy_or_prototype_risk}
  - {id: O, name: oracle_repair, policy: oracle, evaluation_only: true}
  - {id: TA, name: combined_aggressive_threshold, policy: entropy_or_prototype_risk, entropy_threshold: 0.001, prototype_risk_threshold: 1.0e-7}
  - {id: TC, name: combined_conservative_threshold, policy: entropy_or_prototype_risk, entropy_threshold: 0.05, prototype_risk_threshold: 1.0e-5}
  - {id: R1, name: combined_max_blocks_1, policy: entropy_or_prototype_risk, max_blocks_per_step: 1}
  - {id: R4, name: combined_max_blocks_4, policy: entropy_or_prototype_risk, max_blocks_per_step: 4}
  - {id: D16, name: combined_residual_fp16, policy: entropy_or_prototype_risk, storage_dtype: fp16}
  - {id: DB16, name: combined_residual_bf16, policy: entropy_or_prototype_risk, storage_dtype: bf16}
  - {id: D8, name: combined_residual_fp8, policy: entropy_or_prototype_risk, storage_dtype: fp8}
  - {id: DI8, name: combined_residual_int8, policy: entropy_or_prototype_risk, storage_dtype: int8}
  - {id: PAGE, name: combined_cpu_pageable, policy: entropy_or_prototype_risk, placement: cpu_pageable}
controls:
  identical_model_weights_and_precision: true
  identical_processor_and_chat_template: true
  identical_media_preprocessing: true
  identical_prompts_and_sample_ids: true
  identical_generation: true
  identical_active_byte_budget: true
  identical_mandatory_tokens: true
  identical_block_granularity: true
  identical_attention_backend: true
  deterministic_generation: true
  one_variable_at_a_time_sweep: true
