design:
  name: joint_group_donor_output_impact_pareto_knapsack
  candidate_scope: optional_visual_blocks_with_authoritative_normalized_regions
  group_stage: complete_route_local_exact_capacity_counterfactual
  group_identity: layer_head_modality_image_page_frame_and_coarse_row
  reading_order: ascending_original_logical_position_then_node_id
  group_definition: contiguous_nonoverlapping_reading_order_chunks
  maximum_blocks_per_group: 4
  minimum_blocks_per_group: 2
  coarse_row_bins: 4
  group_insertion: complete_atomic_group_union_with_scalar_prompt_topk_anchor
  donor_capacity: exactly_the_positions_added_by_group_members_not_in_the_scalar_anchor
  donor_pool: nonmandatory_scalar_anchor_blocks_not_inside_the_group
  donor_query_loss: >-
    normalized_loss_of_capped_cumulative_prompt_query_coverage_when_the_donor
    is_removed_from_the_scalar_anchor_plus_complete_group
  donor_prompt_loss: donor_prompt_attention_divided_by_all_optional_prompt_attention
  donor_output_impact: >-
    donor_prompt_attention_share_times_nearest_normalized_pooled_value_deviation
    to_an_added_group_block
  joint_donor_objective: >-
    minimize_query_loss_plus_0.5_times_prompt_loss_plus_1.0_times_output_impact
    subject_to_exact_removed_position_capacity
  joint_donor_solver: deterministic_exact_position_dynamic_program
  frontier_rule: >-
    retain_every_joint_counterfactual_not_dominated_in_normalized_query_gain
    combined_prompt_or_output_risk_and_group_bytes
  group_knapsack_rule: >-
    deterministic_multiple_choice_zero_one_byte_knapsack_with_at_most_one
    complete_joint_counterfactual_per_layer_head_route
  group_knapsack_utility: normalized_query_gain_minus_1.01_times_combined_risk
  deterministic_tie_break: lower_joint_cost_then_output_risk_then_prompt_loss_then_query_loss_then_node_ids
  group_admission_rule: >-
    query_gain_at_least_0.000001_and_query_gain_at_least_1.01_times_combined_risk
    and_selected_prompt_mass_at_least_0.95_times_the_same_capacity_scalar_anchor
  non_group_reallocation_rule: >-
    accept_only_if_query_gain_at_least_0.000001_and_at_least_1.01_times
    displaced_prompt_attention_share_times_nearest_pooled_value_deviation
  complete_query_reservation_fraction: 0.25
  atomic_group_share_of_reservation: 0.5
  minimum_per_sample_group_reservation_utilization: 0.75
  utilization_definition: protected_atomic_group_bytes_divided_by_target_group_reservation_bytes
  missing_metadata_behavior: fail_closed_without_group_protection
  infeasible_joint_donor_capacity_behavior: reject_the_group_counterfactual
  benchmark_labels_used: false
  active_byte_change_vs_same_capacity_anchor: 0
  reason: >-
    V96 enumerated roughly_one_thousand Pareto candidates per sample but selected
    only_sixteen groups across_sixty_four samples because prompt-only capacity
    fill chose donors before output impact was evaluated. V97 makes donor choice
    part of candidate construction so the frontier and knapsack receive
    counterfactuals already optimized for output stability.

