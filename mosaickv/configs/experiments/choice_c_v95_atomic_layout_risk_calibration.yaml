design:
  name: atomic_coherent_layout_group_risk_gated_selection
  candidate_scope: optional_visual_blocks_with_authoritative_normalized_regions
  group_stage: complete_route_local_exact_capacity_counterfactual
  group_identity: layer_head_modality_image_page_frame_and_coarse_row
  reading_order: ascending_original_logical_position_then_node_id
  group_definition: contiguous_nonoverlapping_reading_order_chunks
  maximum_blocks_per_group: 4
  minimum_blocks_per_group: 2
  coarse_row_bins: 4
  shortlist_per_route: 4
  shortlist_rule: descending_standalone_query_plus_prompt_score_density
  final_capacity_rule: >-
    an_admitted_group_is_indivisible_and_the_remaining_route_capacity_is
    filled_by_the_highest_prompt_mass_exact_subset
  query_gain: normalized_increase_in_capped_cumulative_prompt_query_mass
  prompt_risk: normalized_scalar_prompt_mass_displaced_by_the_counterfactual
  output_impact_risk: >-
    sum_over_displaced_blocks_of_prompt_attention_share_times_nearest
    normalized_pooled_value_deviation_to_an_added_block
  combined_risk: maximum_of_prompt_risk_and_output_impact_risk
  admission_rule: >-
    query_gain_at_least_0.000001_and_query_gain_at_least_1.01_times_combined_risk
    and_selected_prompt_mass_at_least_0.95_times_the_same_capacity_scalar_anchor
  complete_query_reservation_fraction: 0.25
  atomic_group_share_of_reservation: 0.5
  minimum_per_sample_group_reservation_utilization: 0.75
  utilization_definition: protected_atomic_group_bytes_divided_by_target_group_reservation_bytes
  missing_metadata_behavior: fail_closed_without_group_protection
  benchmark_labels_used: false
  active_byte_change_vs_same_capacity_anchor: 0
  reason: >-
    V94 protected only about 119--129 KiB per sample because its later
    capacity fill could discard most planned groups. V95 makes admission and
    final selection one atomic transaction and requires measured utilization,
    while refusing group substitutions whose query benefit does not clear
    both prompt and output-impact risk.

