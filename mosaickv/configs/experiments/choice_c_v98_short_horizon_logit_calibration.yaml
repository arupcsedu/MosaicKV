design:
  name: short_horizon_fullkv_logit_stable_joint_group_selection
  candidate_scope: optional_visual_blocks_with_authoritative_normalized_regions
  group_stage: complete_route_local_exact_capacity_counterfactual
  group_identity: layer_head_modality_image_page_frame_and_coarse_row
  maximum_blocks_per_group: 4
  minimum_blocks_per_group: 2
  group_and_donor_selection: joint_exact_position_dynamic_program
  pareto_coordinates: normalized_query_gain_combined_surrogate_risk_and_group_bytes
  shortlist_rule: >-
    retain_the_complete_joint_group_allocation_and_its_same_byte_scalar_prompt_topk
    anchor_as_two_nondominated_points_in_query_gain_and_perturbation_risk
  surrogate_role: shortlist_generation_and_deterministic_tie_break_only
  surrogate_hard_rejection: disabled
  group_knapsack_utility_during_shortlist_construction: normalized_query_gain
  probe_reference: original_fullkv_prefill_plus_teacher_forced_fullkv_greedy_prefix
  probe_candidate_state: isolated_same_byte_exact_cache_clone
  probe_steps: 2
  probe_metrics: [maximum_forward_kl, maximum_absolute_logit_difference, greedy_token_match]
  admission_rule: >-
    accept_only_if_every_step_matches_the_fullkv_greedy_token_and_maximum_forward_kl
    is_at_most_0.02_and_maximum_absolute_logit_difference_is_at_most_1.0
  no_admissible_candidate_behavior: execute_scalar_anchor_but_mark_the_logit_gate_failed
  candidate_order: pareto_joint_group_donor_then_scalar_prompt_topk_anchor
  probe_overhead_accounting: separate_compression_phase
  complete_query_reservation_fraction: 0.25
  atomic_group_share_of_reservation: 0.5
  minimum_per_sample_group_reservation_utilization: 0.75
  active_byte_change_between_shortlist_points: 0
  benchmark_labels_used: false
  reason: >-
    V97 produced_about_35705_joint_counterfactuals_and_about_1029_pareto_points
    per_sample_but_its_attention_times_value_deviation_proxy_neither_filled_the
    atomic_reservation_nor_preserved_greedy_outputs. V98 measures the model's
    short_horizon_logit_response_directly_without_training_or_task_labels.

