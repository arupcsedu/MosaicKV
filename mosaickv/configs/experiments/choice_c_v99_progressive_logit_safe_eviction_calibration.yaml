design:
  name: progressive_fullkv_logit_safe_eviction
  initial_cache: exact_fullkv
  protected_items: mandatory_blocks_and_preregistered_coherent_layout_groups
  label_blind_eviction_priority: >-
    ascending_prompt_attention_for_external_stable_heads_and_prompt_plus_mapped
    forecast_attention_output_contribution_value_novelty_and_coverage_risk_for
    compact_planner_heads
  proposal_scope: lowest_risk_blocks_from_routes_above_the_fixed_dense_position_target
  failed_batch_behavior: deterministic_binary_split_until_singleton
  failed_singleton_behavior: protect_for_the_remainder_of_that_sample
  accepted_batch_behavior: cumulative_eviction_from_the_last_accepted_cache
  probe_reference: original_fullkv_prefill_plus_teacher_forced_fullkv_greedy_prefix
  probe_candidate_state: isolated_exact_cache_clone
  probe_steps: 2
  probe_metrics: [maximum_forward_kl, maximum_absolute_logit_difference, greedy_token_match]
  admission_rule: >-
    accept_a_cumulative_eviction_checkpoint_only_if_every_step_matches_the_fullkv
    greedy_token_and_maximum_forward_kl_is_at_most_0.02_and_maximum_absolute
    logit_difference_is_at_most_1.0
  stopping_rule: stop_when_every_layer_head_is_at_or_below_the_preregistered_position_limit
  target_not_reached_behavior: execute_the_preregistered_target_cache_but_mark_the_progressive_gate_failed
  probe_overhead_accounting: separate_compression_phase
  complete_query_reservation_fraction: 0.25
  atomic_group_share_of_reservation: 0.5
  minimum_per_sample_group_reservation_utilization: 0.75
  benchmark_labels_used: false
  reason: >-
    V98 tested_only_two_caches_that_were_already_at_the_compressed_target_and
    only_three_of_sixty_four_samples_passed_its_direct_logit_gate. V99 instead
    searches_from_the_known_correct_FullKV_state_and_accepts_each_progressive
    eviction_only_when_the_model_output_remains_within_the_same_preregistered
    label_blind_stability_envelope.

