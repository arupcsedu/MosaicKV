  restore_donor_levels_must_belong_to_filtered_feasible_ladders: true
  every_final_proposal_checked_against_every_route_position_limit_before_probe: true
  exact_logical_bytes_added_must_equal_bytes_removed: true
  global_logical_active_bytes_must_not_change: true
  candidate_requires_isolated_joint_logit_probe: true
  unprobed_candidate_may_not_be_selected: true
  benchmark_labels_references_scores_answers_and_failure_identities_accessed: false
  fullkv_fallback_remains_fail_closed: true

probe_allocation:
  total_candidate_evaluations: 24
  reserved_post_joint_evaluations: 12
  maximum_screening_evaluations: 11
  final_joint_evaluations: 1
  maximum_restore_donor_evaluations: 12
